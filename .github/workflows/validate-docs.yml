name: Validate RaceDay Planning Documents

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docs folder and required files
        run: |
          echo "Checking RaceDay planning documents..."

          if [ ! -d "Docs" ]; then
            echo "ERROR: Docs folder does not exist."
            exit 1
          fi

          required_files=(
            "SectionA_ERD.pdf"
            "SectionB_RaceDay_Endpoint_Plan.pdf"
            "SectionC_RaceDay_SQL_Execution.pdf"
            "SectionC_schema.sql"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "Docs/$file" ]; then
              echo "ERROR: Missing Docs/$file"
              exit 1
            else
              echo "Found: Docs/$file"
            fi
          done

          echo "All required RaceDay planning documents are present."
